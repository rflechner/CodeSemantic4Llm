name: Build and stage .NET tool

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Build, test and pack with NUKE
        id: pack
        run: dotnet run --project build/Build.csproj -- Pack
      - name: Smoke-test installed tool
        env:
          VERSION: ${{ steps.pack.outputs.version }}
        run: bash eng/verify-tool-package.sh artifacts "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: codesemantic4llm-dotnet-tool
          path: artifacts/CodeSemantic4Llm.Mcp.Server.${{ steps.pack.outputs.version }}.nupkg
          retention-days: 30
          if-no-files-found: error

  stage:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codesemantic4llm-dotnet-tool
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Publish tested tool to GitHub Packages
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          NuGetPackageSourceCredentials_GitHubPackages: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" --name GitHubPackages
          dotnet nuget push "artifacts/CodeSemantic4Llm.Mcp.Server.$VERSION.nupkg" \
            --source GitHubPackages --api-key "$GH_TOKEN"
