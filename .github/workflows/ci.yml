name: .NET build and tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CodeSemantic4Llm.slnx
      - name: Build
        run: dotnet build CodeSemantic4Llm.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test CodeSemantic4Llm.slnx --no-build --configuration Release
      - name: Pack .NET tool
        run: dotnet pack src/CodeSemantic4Llm.Mcp.Server/CodeSemantic4Llm.Mcp.Server.csproj --no-build --configuration Release --output artifacts
      - name: Smoke-test installed tool
        run: bash eng/verify-tool-package.sh artifacts 0.1.0
      - name: Upload .NET tool package
        uses: actions/upload-artifact@v4
        with:
          name: codesemantic4llm-dotnet-tool
          path: artifacts/*.nupkg
          if-no-files-found: error
