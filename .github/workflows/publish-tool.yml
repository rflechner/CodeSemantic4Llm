name: Promote .NET tool to NuGet.org
run-name: Promote CodeSemantic4Llm.Mcp.Server ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Staged version (develop requires X.Y.Z-beta-<commit>, main requires X.Y.Z)
        required: true
        type: string
      run_id:
        description: Successful CI push run (defaults to latest main run or the matching beta commit)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read
  id-token: write

jobs:
  promote:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: nuget-org
    concurrency:
      group: nuget-org-release
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Select trusted build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: bash eng/select-package-run.sh
      - uses: actions/download-artifact@v4
        if: steps.build.outputs.source == 'artifact'
        with:
          name: codesemantic4llm-dotnet-tool
          path: artifacts
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Recover expired artifact from GitHub Packages
        if: steps.build.outputs.source == 'registry'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash eng/download-staged-package.sh
      - name: Verify package identity and source commit
        env:
          COMMIT: ${{ steps.build.outputs.commit }}
        run: python3 eng/verify-release-package.py
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish verified package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/CodeSemantic4Llm.Mcp.Server.$VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
