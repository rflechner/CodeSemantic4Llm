# Repository-specific configuration used by CodeSemantic4Llm.
# The file lives in the source checkout, not in the index storage directory.
version: 1

# Opt in to importing compatible .codesemantic4llm/summaries/**/*.md files.
# Run cache-export explicitly to publish local summaries. See docs/shared-summaries.md.
sharedSummaries: false

analyzers:
  - dotnet-csharp

# Watch waits this many seconds after the most recent source change (default: 15).
# Override for one session with: codesemantic4llm watch . --debounce-seconds 5
watch:
  debounceSeconds: 15

# Optional extension overrides, keyed by enabled analyzer ID.
# Each list replaces that analyzer's defaults (.cs for dotnet-csharp).
# Discovery always visits nested directories, subject to exclusions below.
# fileExtensions:
#   dotnet-csharp: [.cs, .csharp]

# Natural-language summary language (independent of the source language).
# Existing XML summaries are indexed locally. LLM calls are disabled by default.
# When enabled, declarations without summaries are sent to the configured endpoint.
semanticIndexing:
  language: en
  llm:
    enabled: false
    # forceGeneration: true # Replace existing XML summaries using the LLM when enabled.
    # baseUrl: http://127.0.0.1:1234/v1
    # model: your-local-model
    # Optional generation settings; support depends on the model and endpoint.
    # reasoningEffort: low
    # maxCompletionTokens: 2048
    # apiKey: your-api-key # Takes priority over apiKeyEnvironmentVariable when non-empty.
    # apiKeyEnvironmentVariable: CODESEMANTIC4LLM_LLM_API_KEY
    # Or configure multiple independently authenticated endpoints instead of baseUrl:
    # endpoints:
    #   - baseUrl: http://127.0.0.1:1234/v1
    #     apiKeyEnvironmentVariable: FIRST_LLM_KEY
    #   - baseUrl: http://192.168.1.50:1234/v1
    #     apiKeyEnvironmentVariable: SECOND_LLM_KEY
    # maxConcurrentRequestsPerEndpoint: 1
    # retryCount: 3
    # retryDelayMilliseconds: 1000
    # maxConsecutiveFailedFiles: 6

# User-defined excludes extend built-in .git, bin, obj and .codesemantic4llm exclusions.
# Git submodules are NOT automatically excluded; opt out by path as needed.
exclude:
  - submodules/**
