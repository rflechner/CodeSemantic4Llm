# Repository-specific configuration used by CodeSemantic4Llm.
# The file lives in the source checkout, not in the index storage directory.
version: 1

analyzers:
  - dotnet-csharp

# Optional extension overrides, keyed by enabled analyzer ID.
# Each list replaces that analyzer's defaults (.cs for dotnet-csharp).
# Discovery always visits nested directories, subject to exclusions below.
# fileExtensions:
#   dotnet-csharp: [.cs, .csharp]

# Natural-language summary language (independent of the source language).
# LLM calls are disabled by default. When enabled, source declarations and XML docs
# are sent to the configured OpenAI-compatible endpoint.
semanticIndexing:
  language: en
  llm:
    enabled: false
    # baseUrl: http://127.0.0.1:1234/v1
    # model: your-local-model
    # apiKey: your-api-key # Takes priority over apiKeyEnvironmentVariable when non-empty.
    # apiKeyEnvironmentVariable: CODESEMANTIC4LLM_LLM_API_KEY

# User-defined excludes extend the built-in defaults for **/.git/**, **/bin/** and **/obj/**.
# Git submodules are NOT automatically excluded; opt out by path as needed.
exclude:
  - submodules/**
