<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Choisir le côté Git explicitement</title>
  <desc id="desc">Lors d’une fusion ordinaire, other désigne la branche entrante. Pendant un rebasage avec le moteur de fusion, current désigne l’amont et les commits déjà rejoués. Validez la copie de travail après chaque opération.</desc>
  <defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#142c46}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:600}.body{font-size:18px}.small{font-size:16px}</style></defs>
  <rect width="1200" height="610" rx="20" fill="#f2f6fa"/>
  <text x="40" y="55" class="title">Choisir le côté Git explicitement</text>
  <text x="40" y="87" class="body">« Other » est une entrée de la fusion Git. Son sens dépend de l’opération.</text>
  <rect x="40" y="120" width="540" height="302" rx="16" fill="#fff" stroke="#c6d3e0" stroke-width="2"/>
  <rect x="620" y="120" width="540" height="302" rx="16" fill="#fff" stroke="#c6d3e0" stroke-width="2"/>
  <text x="64" y="160" class="label">Fusion ordinaire</text>
  <text x="644" y="160" class="label">Rebasage avec le moteur de fusion</text>
  <text x="64" y="196" class="body">%A / current</text>
  <text x="245" y="196" class="body">Branche extraite</text>
  <text x="644" y="196" class="body">%A / current</text>
  <text x="825" y="196" class="body">Amont et commits déjà rejoués</text>
  <text x="64" y="237" class="body">%B / other</text>
  <text x="245" y="237" class="body">Branche entrante</text>
  <text x="644" y="237" class="body">%B / other</text>
  <text x="825" y="237" class="body">Commit local en cours de rejeu</text>
  <rect x="64" y="270" width="492" height="64" rx="9" fill="#dcecfb"/>
  <text x="84" y="297" class="body" style="font-weight:600">other conserve le document entrant</text>
  <text x="84" y="322" class="small">Défaut installé par setup-git</text>
  <rect x="644" y="270" width="492" height="64" rx="9" fill="#e0f2e8"/>
  <text x="664" y="297" class="body" style="font-weight:600">current conserve le document amont</text>
  <text x="664" y="322" class="small">Changer le pilote pour ce rebasage</text>
  <text x="64" y="372" class="body">Le document choisi est repris en entier.</text>
  <text x="644" y="372" class="body">Le document choisi est repris en entier.</text>
  <text x="64" y="399" class="small">Le pilote ne vise que les résumés générés.</text>
  <text x="644" y="399" class="small">Git traite les conflits du code comme d’habitude.</text>
  <rect x="40" y="451" width="1120" height="112" rx="14" fill="#142c46"/>
  <text x="64" y="487" class="label" style="fill:#fff">Après Git, valider la copie de travail finale</text>
  <text x="64" y="520" class="body" style="fill:#d5e5f5">Empreintes identiques : importer. Empreintes différentes : régénérer localement. L’export reste explicite.</text>
  <text x="64" y="546" class="small" style="fill:#d5e5f5">Un fichier non commité ou non suivi peut bloquer Git avant le pilote. Préservez vos modifications ou résolvez le conflit.</text>
</svg>
