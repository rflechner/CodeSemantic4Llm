<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">How Program.cs.md reaches a teammate</title>
  <desc id="desc">With LLM indexing and shared summaries enabled, one developer indexes Program.cs, exports its descriptions, reviews the Markdown, and commits and pushes it with the source. A teammate pulls the commit and runs index. Compatible descriptions enter the teammate's local SQLite index without a new LLM call.</desc>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #142c46 }
    .title { font-size: 32px; font-weight: 700 }
    .label { font-size: 20px; font-weight: 650 }
    .body { font-size: 17px }
    .code { font-family: Consolas, monospace; font-size: 16px; fill: #145f59 }
    .tag { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; fill: #456077 }
  </style>
  <rect width="960" height="420" rx="18" fill="#f2f6fa"/>
  <text x="28" y="35" class="tag">HELLOWORLD  /  SHARED SUMMARIES</text>
  <text x="28" y="77" class="title">How Program.cs.md reaches a teammate</text>
  <text x="28" y="108" class="body">Both checkouts have LLM indexing and shared summaries enabled.</text>
  <rect x="28" y="135" width="264" height="166" rx="12" fill="#fff" stroke="#c6d3e0"/>
  <text x="45" y="168" class="label">Your checkout</text>
  <text x="45" y="200" class="code">index .</text>
  <text x="45" y="225" class="body">Describe Program and Main.</text>
  <text x="45" y="260" class="code">cache-export .</text>
  <text x="45" y="285" class="body">Write one Markdown file.</text>
  <path d="M298 211h29m-7 -7 7 7 -7 7" fill="none" stroke="#526782" stroke-width="2"/>
  <rect x="336" y="135" width="280" height="166" rx="12" fill="#deeee9" stroke="#a8cdc0"/>
  <text x="353" y="168" class="label">Shared Git branch</text>
  <text x="353" y="200" class="body">Review, commit and push</text>
  <text x="353" y="225" class="body">the source and its summary.</text>
  <text x="353" y="260" class="code">.codesemantic4llm/summaries/</text>
  <text x="353" y="285" class="code">  Program.cs.md</text>
  <path d="M622 211h29m-7 -7 7 7 -7 7" fill="none" stroke="#526782" stroke-width="2"/>
  <rect x="660" y="135" width="272" height="166" rx="12" fill="#fff" stroke="#c6d3e0"/>
  <text x="677" y="168" class="label">Teammate’s checkout</text>
  <text x="677" y="200" class="code">git pull</text>
  <text x="677" y="225" class="body">Receive both files.</text>
  <text x="677" y="260" class="code">index .</text>
  <text x="677" y="285" class="body">Validate and import locally.</text>
  <text x="28" y="340" class="tag">WHAT GETS REUSED?</text>
  <text x="28" y="371" class="body">Each checkout builds its own SQLite index. Matching descriptions skip the LLM call.</text>
  <text x="28" y="398" class="body">If the source or generation settings differ, indexing can generate missing descriptions locally.</text>
</svg>
